function b64(b){const s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
async function unlock(e){e.preventDefault();const btn=document.getElementById('btn'),err=document.getElementById('err'),pw=document.getElementById('pw').value;if(!pw)return;btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Decrypting\u2026';err.style.display='none';try{const enc=new TextEncoder(),salt=b64(PAYLOAD.salt),iv=b64(PAYLOAD.iv),data=b64(PAYLOAD.data);const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);const html=new TextDecoder().decode(dec);document.open();document.write(html);document.close()}catch(ex){err.style.display='block';btn.disabled=false;btn.textContent='Unlock';document.getElementById('pw').value='';document.getElementById('pw').focus()}}
