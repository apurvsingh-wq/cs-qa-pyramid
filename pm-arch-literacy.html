<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .gate {
    text-align: center;
    max-width: 420px;
    padding: 2rem;
  }

  .gate .lock-icon {
    width: 64px;
    height: 64px;
    background: rgba(14, 165, 233, 0.1);
    border: 1px solid rgba(14, 165, 233, 0.2);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
    font-size: 1.75rem;
  }

  .gate h1 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
    color: #f1f5f9;
  }

  .gate p {
    font-size: 0.85rem;
    color: #94a3b8;
    margin-bottom: 2rem;
    line-height: 1.55;
  }

  .input-group {
    position: relative;
    margin-bottom: 1rem;
  }

  .input-group input {
    width: 100%;
    padding: 0.85rem 1rem;
    font-size: 0.95rem;
    font-family: inherit;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    color: #f1f5f9;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-group input:focus {
    border-color: #0ea5e9;
    box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
  }

  .input-group input::placeholder { color: #64748b; }

  .btn {
    width: 100%;
    padding: 0.85rem;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    background: linear-gradient(135deg, #0ea5e9, #0284c7);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
  }

  .btn:active { transform: translateY(0); }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .error {
    color: #f87171;
    font-size: 0.8rem;
    margin-top: 0.75rem;
    display: none;
  }

  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 0.5rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .footer-note {
    margin-top: 2rem;
    font-size: 0.7rem;
    color: #475569;
  }
</style>
</head>

function b64ToArr(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function unlock(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  const pw = document.getElementById('pw').value;

  if (!pw) return;

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Decrypting…';
  err.style.display = 'none';

  try {
    const enc = new TextEncoder();
    const salt = b64ToArr(PAYLOAD.salt);
    const iv = b64ToArr(PAYLOAD.iv);
    const data = b64ToArr(PAYLOAD.data);

    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );

    const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
    const html = new TextDecoder().decode(decrypted);

    document.open();
    document.write(html);
    document.close();
  } catch(ex) {
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Unlock';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement.id === 'pw') unlock(e);
});
</script>
